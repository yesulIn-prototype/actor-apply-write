spring.application.name=actor-api
# Railway and similar hosts hand the port in $PORT.
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB
server.error.include-message=never
yesulin.workspace=${java.io.tmpdir}/yesulin-actor
yesulin.document-ttl=PT30M
yesulin.stats-file=./data/completed-count.txt
yesulin.rhwp.path=../tools/rhwp/rhwp/rhwp

# Behind a reverse proxy (nginx, Cloudflare), take the visitor's IP from X-Forwarded-For; Tomcat trusts
# only private-network proxies for it, so a client cannot spoof its IP to dodge the rate limit.
server.forward-headers-strategy=native

# Logs: one line per API call plus document events (ids and counts only, never applicant data).
logging.file.name=${YESULIN_LOG_FILE:./logs/actor-api.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.level.kr.yesulin.actor=INFO

# Abuse guards: uploads/builds per visitor per window, and uploads kept at once.
yesulin.rate-limit.requests=60
yesulin.rate-limit.window=PT10M
yesulin.max-documents=300
# Only when the app and API are on different origins, e.g. https://app.example.com
yesulin.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
